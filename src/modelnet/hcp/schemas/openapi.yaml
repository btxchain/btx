      - observed_at_ms
      allOf:
      - if:
          properties:
            state:
              enum:
              - CONFIRMED
              - NATIVE_OUTCOME_OBSERVED
              - SETTLED
              - REFUNDED
        then:
          properties:
            evidence_basis:
