          - NATIVE_NODE_OBSERVED
          - EXTERNAL_VERIFIER_OBSERVED
        custody_mode:
          type: string
          enum:
          - CUSTODIAL
          - SELF_CUSTODY
        refund_controller:
          type: string
          enum:
          - CUSTOMER_KEY
          - CEX_CUSTODIAL_KEY
        native_observation:
          anyOf:
          - $ref: '#/components/schemas/NativeObservation'
          - type: 'null'
        observed_at_ms:
          $ref: '#/components/schemas/UIntString'
