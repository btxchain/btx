        quote_id:
          $ref: '#/components/schemas/Id'
        quote_body_id:
          $ref: '#/components/schemas/Digest48'
        action:
          $ref: '#/components/schemas/NativeEconomicAction'
        terms_id:
          $ref: '#/components/schemas/Digest48'
        native_template_id:
          $ref: '#/components/schemas/Digest48'
        amounts:
          $ref: '#/components/schemas/Amounts'
        policy_id:
          $ref: '#/components/schemas/Id'
        policy_revision:
          $ref: '#/components/schemas/UIntString'
        refund_controller:
          type: string
