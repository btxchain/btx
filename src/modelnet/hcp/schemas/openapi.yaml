components:
  schemas:
    Digest48:
      type: string
      pattern: ^[0-9a-f]{96}$
    Digest32:
      type: string
      pattern: ^[0-9a-f]{64}$
    UIntString:
      type: string
      pattern: ^(0|[1-9][0-9]{0,19})$
    Id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    HttpsUrl:
      type: string
      pattern: ^https://[^\s]+$
      maxLength: 2048
    Network:
      type: object
      additionalProperties: false
      properties:
        environment:
          type: string
          enum:
          - MAINNET
          - TESTNET
          - REGTEST
        genesis_hash:
          $ref: '#/components/schemas/Digest32'
      required:
      - environment
      - genesis_hash
    Effects:
      type: array
      items:
        type: string
        enum:
        - INSPECT
        - FETCH_METADATA
        - ACQUIRE_MODEL
        - SEED_MODEL
        - INSTALL_CLIENT
        - PLAN_LOCAL_RUN
        - EXECUTE_LOCAL_RUN
        - REPORT_READINESS
      maxItems: 16
      minItems: 0
    Readiness:
      type: string
      enum:
      - VERIFIED_FILES
      - RUNTIME_LOADED
      - RUNTIME_READY
      - FIRST_USEFUL_RESULT
    FinancialState:
      type: string
      enum:
      - PREPARED
      - AUTHORIZED
      - RESERVED
      - SIGNING
      - SIGNED
      - BROADCAST_UNKNOWN
      - BROADCAST
      - CONFIRMED
      - NATIVE_OUTCOME_OBSERVED
      - SETTLED
      - EXPIRED
      - CANCELED
      - REJECTED
      - RECONCILIATION_REQUIRED
      - CONFIRMATION_REVERTED
      - REFUND_ELIGIBLE
      - REFUND_SUBMITTED
      - REFUNDED
    Action:
      type: string
      enum:
      - FUND_RELEASE
      - FUND_BOUNTY
      - CLAIM
      - REFUND
      - CONVERT
      - WITHDRAW
    Amounts:
      type: object
      additionalProperties: false
      properties:
        principal_atoms:
          $ref: '#/components/schemas/UIntString'
        network_fee_cap_atoms:
          $ref: '#/components/schemas/UIntString'
        service_fee_atoms:
          $ref: '#/components/schemas/UIntString'
        tax_atoms:
          $ref: '#/components/schemas/UIntString'
        max_total_debit_atoms:
          $ref: '#/components/schemas/UIntString'
      required:
      - principal_atoms
      - network_fee_cap_atoms
      - service_fee_atoms
      - tax_atoms
      - max_total_debit_atoms
    SourceHint:
      type: object
      additionalProperties: false
      properties:
        provider_key_id:
          $ref: '#/components/schemas/Id'
        endpoint:
          type: string
          minLength: 1
          maxLength: 512
        kind:
          type: string
          enum:
          - NATIVE_PROVIDER
          - NATIVE_ROUTER
      required:
      - provider_key_id
      - endpoint
      - kind
    PackageRef:
      type: object
      additionalProperties: false
      properties:
        package_core_id:
          $ref: '#/components/schemas/Digest48'
        file_sha384:
          $ref: '#/components/schemas/Digest48'
        recipe_id:
          $ref: '#/components/schemas/Digest48'
        download_url:
          $ref: '#/components/schemas/HttpsUrl'
      required:
      - package_core_id
      - file_sha384
      - recipe_id
      - download_url
    ProviderProfile:
      type: object
      additionalProperties: false
      properties:
        version:
          const: 1
        provider_id:
          $ref: '#/components/schemas/Id'
        profile_sequence:
          $ref: '#/components/schemas/UIntString'
        issued_at_ms:
          $ref: '#/components/schemas/UIntString'
        expires_at_ms:
          $ref: '#/components/schemas/UIntString'
        origin:
          $ref: '#/components/schemas/HttpsUrl'
        api_base:
          $ref: '#/components/schemas/HttpsUrl'
        network:
          $ref: '#/components/schemas/Network'
        supported_profiles:
          type: array
          items:
            type: string
            enum:
            - DISCOVERY
            - HANDOFF
            - CUSTODY
            - FUNDING
            - FLEET
          maxItems: 5
          minItems: 1
        package_core_versions:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 255
          maxItems: 16
          minItems: 1
        keyset_url:
          $ref: '#/components/schemas/HttpsUrl'
        oauth_metadata_url:
          $ref: '#/components/schemas/HttpsUrl'
        custody_modes:
          type: array
          items:
            type: string
            enum:
            - DISCOVERY_ONLY
            - CUSTODIAL
            - SELF_CUSTODY
          maxItems: 3
          minItems: 1
        financial_observation_modes:
          type: array
          items:
            type: string
            enum:
            - HOSTED_ATTESTED
            - INDEPENDENT_VERIFIER
          maxItems: 2
          minItems: 0
        max_body_bytes:
          $ref: '#/components/schemas/UIntString'
        max_page_size:
          type: integer
          minimum: 1
          maximum: 1000
        privacy_url:
          $ref: '#/components/schemas/HttpsUrl'
        export_supported:
          type: boolean
      required:
      - version
      - provider_id
      - profile_sequence
      - issued_at_ms
      - expires_at_ms
      - origin
      - api_base
      - network
      - supported_profiles
      - package_core_versions
      - keyset_url
      - oauth_metadata_url
      - custody_modes
      - financial_observation_modes
      - max_body_bytes
      - max_page_size
      - privacy_url
      - export_supported
    CapabilityOffer:
      type: object
      additionalProperties: false
      properties:
        version:
          const: 1
        provider_id:
          $ref: '#/components/schemas/Id'
        network:
          $ref: '#/components/schemas/Network'
        offer_id:
          $ref: '#/components/schemas/Id'
        issued_at_ms:
          $ref: '#/components/schemas/UIntString'
        expires_at_ms:
