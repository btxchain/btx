      - origin
      - api_base
      - network
      - supported_profiles
      - package_core_versions
      - keyset_url
      - oauth_metadata_url
      - custody_modes
      - financial_observation_modes
      - max_body_bytes
      - max_page_size
      - privacy_url
      - export_supported
