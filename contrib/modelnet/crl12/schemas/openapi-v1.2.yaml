        api_base:
          $ref: '#/components/schemas/HttpsUrl'
        network:
          $ref: '#/components/schemas/Network'
        supported_profiles:
          type: array
          items:
            type: string
            enum:
            - DISCOVERY
            - HANDOFF
            - CUSTODY
            - FUNDING
            - FLEET
          maxItems: 5
          minItems: 1
        package_core_versions:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 255
          maxItems: 16
          minItems: 1
        keyset_url:
          $ref: '#/components/schemas/HttpsUrl'
        oauth_metadata_url:
          $ref: '#/components/schemas/HttpsUrl'
        custody_modes:
          type: array
