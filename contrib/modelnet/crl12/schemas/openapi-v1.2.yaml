                $ref: '#/components/schemas/CR12_Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CR12_ScenarioRequest'
  /institutional/scenarios/{id}:
    get:
      operationId: getInstitutionalScenario
      summary: Return financial change separately from operational impacts and unpriced
        exposures.
      x-btx-effect: READ
      x-btx-scope: scenarios:read
      x-btx-extension: CRL/1.2
      security:
      - hcpOAuth:
        - scenarios:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CR12_Id'
      responses:
        '200':
          description: Typed result; no financial success implied by an accepted job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CR12_ScenarioResultV1_2Envelope'
        default:
          description: Structured boundary error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CR12_Error'
  /layer/conformance/{id}:
    get:
      operationId: getLayerConformance
      summary: Per-role test scope and issuer; self-attestation is not centrally granted
        certification.
      x-btx-effect: READ
      x-btx-scope: catalog:read
      x-btx-extension: CRL/1.2
      security:
      - hcpOAuth:
        - catalog:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CR12_Id'
      responses:
        '200':
          description: Typed result; no financial success implied by an accepted job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CR12_ConformanceStatementV1_2Envelope'
        default:
          description: Structured boundary error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CR12_Error'
  /layer/jobs/{id}:
    get:
      operationId: getLayerJob
      summary: Owner-scoped durable job status; result_ref points to the typed resource
        getter. No poll URL from untrusted metadata.
      x-btx-effect: READ
      x-btx-scope: jobs:read
      x-btx-extension: CRL/1.2
      security:
      - hcpOAuth:
        - jobs:read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CR12_Id'
      responses:
        '202':
          description: Typed result; no financial success implied by an accepted job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CR12_Job'
        default:
          description: Structured boundary error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CR12_Error'
  /layer/jobs/{id}/cancel:
    post:
      operationId: cancelLayerJob
      summary: Cancel bounded projection/import/scenario work before commit or return
        the already committed result; no finance cancellation implied.
      x-btx-effect: RECORD
      x-btx-scope: jobs:cancel
      x-btx-extension: CRL/1.2
      security:
      - hcpOAuth:
        - jobs:cancel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CR12_Id'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/CR12_Id'
      responses:
        '202':
          description: Typed result; no financial success implied by an accepted job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CR12_Job'
        default:
          description: Structured boundary error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CR12_Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CR12_IdRequest'
  /institutional/imports/chunks:
    post:
      operationId: stageInstitutionalImportChunk
      summary: Stream an authenticated quota-bounded chunk, verify its declared hash,
        and return a tenant-owned opaque staged handle.
      x-btx-effect: RECORD
      x-btx-scope: imports:write
      x-btx-extension: CRL/1.2
      security:
      - hcpOAuth:
        - imports:write
      parameters:
      - name: X-Content-SHA384
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/CR12_Digest48'
      - name: Content-Length
        in: header
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 16777216
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          $ref: '#/components/schemas/CR12_Id'
      responses:
        '200':
          description: Typed result; no financial success implied by an accepted job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CR12_StagedChunk'
        default:
          description: Structured boundary error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CR12_Error'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
components:
  schemas:
    Digest48:
      type: string
      pattern: ^[0-9a-f]{96}$
    Digest32:
      type: string
      pattern: ^[0-9a-f]{64}$
    UIntString:
      type: string
      pattern: ^(0|[1-9][0-9]{0,19})$
    Id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    HttpsUrl:
      type: string
      pattern: ^https://[^\s]+$
      maxLength: 2048
    Network:
      type: object
      additionalProperties: false
      properties:
        environment:
          type: string
          enum:
          - MAINNET
          - TESTNET
          - REGTEST
        genesis_hash:
          $ref: '#/components/schemas/Digest32'
      required:
      - environment
      - genesis_hash
    Effects:
      type: array
      items:
        type: string
        enum:
        - INSPECT
        - FETCH_METADATA
        - ACQUIRE_MODEL
        - SEED_MODEL
        - INSTALL_CLIENT
        - PLAN_LOCAL_RUN
        - EXECUTE_LOCAL_RUN
        - REPORT_READINESS
      maxItems: 16
      minItems: 0
    Readiness:
      type: string
      enum:
      - VERIFIED_FILES
      - RUNTIME_LOADED
      - RUNTIME_READY
      - FIRST_USEFUL_RESULT
    FinancialState:
      type: string
      enum:
      - PREPARED
      - AUTHORIZED
      - RESERVED
      - SIGNING
      - SIGNED
      - BROADCAST_UNKNOWN
      - BROADCAST
      - CONFIRMED
      - NATIVE_OUTCOME_OBSERVED
      - SETTLED
      - EXPIRED
      - CANCELED
      - REJECTED
      - RECONCILIATION_REQUIRED
      - CONFIRMATION_REVERTED
      - REFUND_ELIGIBLE
      - REFUND_SUBMITTED
      - REFUNDED
    Action:
      type: string
      enum:
      - FUND_RELEASE
      - FUND_BOUNTY
      - CLAIM
      - REFUND
      - CONVERT
      - WITHDRAW
    Amounts:
      type: object
      additionalProperties: false
      properties:
        principal_atoms:
          $ref: '#/components/schemas/UIntString'
        network_fee_cap_atoms:
          $ref: '#/components/schemas/UIntString'
        service_fee_atoms:
          $ref: '#/components/schemas/UIntString'
        tax_atoms:
          $ref: '#/components/schemas/UIntString'
        max_total_debit_atoms:
          $ref: '#/components/schemas/UIntString'
      required:
      - principal_atoms
      - network_fee_cap_atoms
      - service_fee_atoms
      - tax_atoms
      - max_total_debit_atoms
    SourceHint:
      type: object
      additionalProperties: false
      properties:
        provider_key_id:
          $ref: '#/components/schemas/Id'
        endpoint:
          type: string
          minLength: 1
          maxLength: 512
        kind:
          type: string
          enum:
          - NATIVE_PROVIDER
          - NATIVE_ROUTER
      required:
      - provider_key_id
      - endpoint
      - kind
    PackageRef:
      type: object
      additionalProperties: false
      properties:
        package_core_id:
          $ref: '#/components/schemas/Digest48'
        file_sha384:
          $ref: '#/components/schemas/Digest48'
        recipe_id:
          $ref: '#/components/schemas/Digest48'
        download_url:
          $ref: '#/components/schemas/HttpsUrl'
      required:
      - package_core_id
      - file_sha384
      - recipe_id
      - download_url
    ProviderProfile:
      type: object
      additionalProperties: false
      properties:
        version:
          const: 1
        provider_id:
          $ref: '#/components/schemas/Id'
        profile_sequence:
          $ref: '#/components/schemas/UIntString'
        issued_at_ms:
          $ref: '#/components/schemas/UIntString'
        expires_at_ms:
