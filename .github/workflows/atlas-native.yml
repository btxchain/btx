name: Atlas native qualification (lock required)
on:
  workflow_dispatch:
  pull_request:
    paths: ['gui/atlas/**', 'contrib/atlas/**', '.github/workflows/atlas-native.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Require reviewed dependency closure
        shell: bash
        run: test -f gui/atlas/Cargo.lock || { echo 'Native qualification blocked: resolve, audit and commit Cargo.lock first'; exit 1; }
      - name: Linux WebView development dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libgtk-3-dev
      - name: Install pinned compiler
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - run: cargo test --locked -p btx-atlas-core
        working-directory: gui/atlas
      - run: cargo check --locked -p btx-atlas
        working-directory: gui/atlas
      - run: cargo build --locked --release -p btx-atlas
        working-directory: gui/atlas
      - name: Windows executable ACL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          & powershell.exe -NoProfile -NonInteractive -File ./contrib/atlas/check_windows_acl.ps1 ./gui/atlas/target/release/btx-atlas.exe
          exit $LASTEXITCODE
      - name: Installer signature
        shell: bash
        run: |
          bundle="gui/atlas/target/release/bundle"
          if [ ! -d "$bundle" ]; then
            echo "installer bundle directory absent; signature check not run"
            exit 0
          fi
          py=python3
          if ! command -v python3 >/dev/null 2>&1; then
            py=python
          fi
          code=0
          "$py" contrib/atlas/check_installer_signature.py --path "$bundle" || code=$?
          if [ "$code" -eq 2 ]; then
            exit 0
          fi
          exit "$code"
      - name: Reminder
        shell: bash
        run: echo 'A native build alone does not qualify wallet safety, OS dialogs, physical hardware, installer signing, or complete Qt parity.'
